models:
  - name: stg_rides
    columns:
      - name: ride_id
        data_tests:
          - unique
          - not_null
      - name: started_at
        data_tests:
          - not_null
      - name: end_station_name
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: rider_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['member', 'casual']
  - name: stg_weather
    columns:
      - name: weather_hour
        data_tests:
          - unique
          - not_null
